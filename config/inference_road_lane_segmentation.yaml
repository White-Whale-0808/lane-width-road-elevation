model:
  device: "cuda"
  model_name: "pidnet_l"
  weight_path: "pidnet_pretrained_model/PIDNet_L_Cityscapes_test.pt"

input:
  image_path: "inference_datasets/carla_dataset_Town03_20260822_021432/images/000380.png"
  image_batch_path: "inference_datasets/carla_dataset_Town03_20260822_021432/images"
  resize_size:  # [height, width]
    - 512
    - 1024

road_segmentation:
  # No parameters: PIDNet-L takes the argmax over classes, no morphological cleanup.

line_segmentation:
  min_segment_length_near: 65  # ELSED length threshold (px) at the image bottom
  min_segment_length_far: 0    # ... at the image top; interpolated linearly by segment mid-y

lane_segmentation:
  # Every threshold is derived from pitch_estimation's f_x / f_y / camera_height.
  # This stage takes no lane width (the cross-lane cap is measured per frame).
  track_bands: 16  # Bands for near-to-far continuity tracking (clamped to >= 16)

lane_fitting:
  num_samples: 80       # Width-sample count, used only when samples_per_meter is unset
  samples_per_meter: 6  # Width samples per metre of visible depth (preferred)

pitch_estimation:
  # Intrinsics of THIS dataset: captured 1280x720 at fov 90 (f = 640), resized to
  # 1024x512 non-uniformly -> f_x = 640 * 0.8 = 512, f_y = 640 * 512/720 = 455.
  # Runners switch to a dataset's own camera (metadata.json) when it differs from
  # this one — OpenLane, the OpenLane-camera CARLA set (libs/dataset_camera.py).
  f_x: 512
  f_y: 455

  # Used ONLY for a frame whose sequence has not measured any width yet (the width
  # is otherwise measured per frame, see below); such frames are flagged
  # w_real_status = last_resort. Delete the key / set null to output no pitch instead.
  #
  # Inner-edge to inner-edge (m), not CARLA's waypoint.lane_width (centre to centre).
  # 3.25 is specific to this road: double yellow left + single white right on a 3.5 m
  # lane (geometry and four independent measurements agree, 3.243-3.260). Other
  # layouts on a 3.5 m lane: single+single 3.375, double+double 3.125.
  #
  # Do NOT tune this against profile MAE: MAE trades the depth scale against pitch
  # error, so its optimum is systematically low (it prefers 3.10-3.15).
  last_resort_lane_width: 3.25

  camera_height: 1.08         # Camera height above the road (m), CAMERA_HEIGHT in get_carlaDataset.py
  camera_forward_offset: 1.5  # Camera ahead of the vehicle origin (m); GT at camera depth z is looked up at z + this
  method: windowed            # "windowed" (local z-window Theil-Sen) or "spline" (global weighted spline)

  # 車道寬一律由近場地平面逐幀實測（門檻推導見 pitch_estimation.py 的 NEARFIELD_* 常數）。
  # 這一幀量不到時：
  #   同一段已量到過 -> 沿用上一次的值（多舊都沿用），沿用多久寫進 w_real_hold_m / _frames
  #   同一段還沒量到 -> 用上面的 last_resort_lane_width，標 w_real_status=last_resort
  # 原因寫進 w_real_reason，批次結尾印統計。
  # ⚠ 品質閘門擋得住雜訊，擋不住「自信地錯」（例：OpenLane 電車軌量成 1.58 m，真值 3.17），要在選線階段擋。
  # ⚠ 寬度變準時 profile MAE 可能反而變差（同上：MAE 拿深度尺度換 pitch 誤差）；以寬度正確為準。

ground_truth:
  # 評估用的參考值，不是 pipeline 的階段。高度來源：
  #   auto     - 有 z_mesh 欄就用 mesh，沒有（WWH-14 之前的舊資料集）退回 analytic
  #   analytic - road_profile.csv 的 z，OpenDRIVE 解析中心線
  #   mesh     - z_mesh，採集時向下射線打到路面網格的高度（較準，證據見 libs/road_profile_gt.py）
  # 明確寫 mesh 而資料集沒有那欄會報錯；只有 auto 會退回。
  # ⚠ 不要用「絕對高度」MAE 比較兩者：它被每幀一個常數偏移主導，要先扣掉每幀常數項。
  height_source: "auto"

visualization:
  alpha: 0.4
  save_path: "outputs/result.png"

csv_io:
  input_dir: "inference_datasets/carla_dataset_Town03_20260822_021432/measurements.csv"
  output_dir: "outputs/measurements.csv"
  measurements_csv: "inference_datasets/carla_dataset_Town03_20260822_021432/measurements.csv"
  problem_csv: "outputs/problem.csv"  # Frames with profile_mae above problem_mae_threshold, worst first
  problem_mae_threshold: 2.0          # Degrees
